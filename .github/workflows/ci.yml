name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  palette:
    name: Brand palette
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate theme JSON
        run: |
          python3 -c "import json,sys; json.load(open('about.json')); print('about.json parses')"
      - name: Brand palette guard
        run: python3 scripts/check_palette.py
